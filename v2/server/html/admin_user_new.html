<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New User — Admin</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="card wide">
  <div class="row between">
    <h1>➕ New User</h1>
    <span><span id="verifiedSlot"></span> <a class="btn ghost small" href="/admin">← Admin</a></span>
  </div>

  <!-- The form itself is /static/user_form.js, shared with the check-in page's
       inline New User panel so the two cannot drift apart. -->
  <div id="formWrap">
    <div id="userForm"></div>
    <button class="btn" id="createBtn" type="button">Create user</button>
    <span id="msg" class="muted small"></span>
  </div>

  <div id="done" style="display:none" class="center">
    <div class="status ok">✓ Created <span id="who"></span></div>
    <p class="muted">Have the guest scan this to finish onboarding:</p>
    <div id="qr" class="center" style="display:inline-block"></div>
    <p class="small"><a id="freshLink" href="#" target="_blank"></a></p>
    <div class="actions">
      <a id="checkinLink" class="btn" href="#">🛒 Check this user in</a>
      <a id="editLink" class="btn ghost" href="#">✏️ Edit</a>
      <a class="btn ghost" href="/admin/user/new" onclick="location.reload()">Create another</a>
    </div>
  </div>
</main>

<script src="/static/verified.js"></script>
<script src="/static/user_form.js"></script>
<script>
let FORM = null;

userFormOptions().then(opts => {
  // The verified badge sits in the page header here, so hand the form that slot
  // instead of letting it render its own.
  FORM = renderUserForm(document.getElementById('userForm'),
    Object.assign({ verifiedSlot: document.getElementById('verifiedSlot') }, opts));
  FORM.focus();
});

document.getElementById('createBtn').onclick = async function () {
  const msg = document.getElementById('msg');
  if (!FORM) return;
  if (!FORM.valid()) { msg.innerHTML = '<span class="err">First and last name are required.</span>'; return; }
  msg.textContent = 'Creating…';
  const res = await fetch('/admin/user/new', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(FORM.collect())
  });
  const data = await res.json();
  if (!res.ok || !data.result) { msg.innerHTML = '<span class="err">' + (data.error || 'Error') + '</span>'; return; }
  const u = data.result;
  document.getElementById('formWrap').style.display = 'none';
  document.getElementById('done').style.display = 'block';
  document.getElementById('who').textContent = u.name_string;
  const fresh = '/user/login/fresh/' + u.uuid;
  const a = document.getElementById('freshLink'); a.href = fresh; a.textContent = fresh;
  document.getElementById('checkinLink').href = '/admin/checkin/' + u.uuid;
  // Straight back into the record just typed — /admin/users/<uuid> deep-links the
  // Users page into that user's editor.
  document.getElementById('editLink').href = '/admin/users/' + u.uuid;
  renderHandoffQR(document.getElementById('qr'), u.uuid);
};
</script>
<script src="/static/qr-code-styling.min.js"></script>
<script src="/static/qr.js"></script>
</body>
</html>
